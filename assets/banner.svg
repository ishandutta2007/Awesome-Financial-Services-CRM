<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="45%" stop-color="#0c142b" />
      <stop offset="100%" stop-color="#140f2d" />
    </linearGradient>

    <!-- Glowing Accents -->
    <radialGradient id="glowCyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowPurple" cx="85%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#9d4edd" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#9d4edd" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowEmerald" cx="50%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Chart Line Gradient -->
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="75%" stop-color="#9d4edd" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E2E8F0" />
      <stop offset="75%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0% { transform: scale(1) translate(0px, 0px); opacity: 0.3; }
      50% { transform: scale(1.15) translate(15px, -10px); opacity: 0.55; }
      100% { transform: scale(1) translate(0px, 0px); opacity: 0.3; }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -120; }
    }
    @keyframes floatPill1 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
      100% { transform: translateY(0px); }
    }
    @keyframes floatPill2 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-9px); }
      100% { transform: translateY(0px); }
    }
    @keyframes floatPill3 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0px); }
    }
    @keyframes nodeBlink {
      0%, 100% { opacity: 0.4; r: 3; }
      50% { opacity: 1; r: 5; }
    }
    .orb-cyan { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 120px; }
    .orb-purple { animation: pulseOrb 10s ease-in-out infinite 2s; transform-origin: 950px 180px; }
    .flow-line { stroke-dasharray: 8 6; animation: dashMove 6s linear infinite; }
    .flow-line-reverse { stroke-dasharray: 6 8; animation: dashMove 8s linear infinite reverse; }
    .pill-1 { animation: floatPill1 4s ease-in-out infinite; }
    .pill-2 { animation: floatPill2 5s ease-in-out infinite 1s; }
    .pill-3 { animation: floatPill3 4.5s ease-in-out infinite 2s; }
    .node-1 { animation: nodeBlink 3s ease-in-out infinite; }
    .node-2 { animation: nodeBlink 3s ease-in-out infinite 1.5s; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Ambient Light Orbs (Background layer) -->
  <circle cx="220" cy="120" r="260" fill="url(#glowCyan)" class="orb-cyan" />
  <circle cx="980" cy="180" r="280" fill="url(#glowPurple)" class="orb-purple" />
  <circle cx="600" cy="380" r="240" fill="url(#glowEmerald)" opacity="0.4" />

  <!-- Decorative Architectural Grid & Network Lines (Behind Foreground Content) -->
  <g opacity="0.15" stroke="#38BDF8" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" stroke-dasharray="4 4" />
    <line x1="0" y1="140" x2="1200" y2="140" stroke-dasharray="4 4" />
    <line x1="0" y1="210" x2="1200" y2="210" stroke-dasharray="4 4" />
    <line x1="0" y1="280" x2="1200" y2="280" stroke-dasharray="4 4" />
    <line x1="0" y1="350" x2="1200" y2="350" stroke-dasharray="4 4" />
    <line x1="200" y1="0" x2="200" y2="420" stroke-dasharray="4 4" />
    <line x1="400" y1="0" x2="400" y2="420" stroke-dasharray="4 4" />
    <line x1="600" y1="0" x2="600" y2="420" stroke-dasharray="4 4" />
    <line x1="800" y1="0" x2="800" y2="420" stroke-dasharray="4 4" />
    <line x1="1000" y1="0" x2="1000" y2="420" stroke-dasharray="4 4" />
  </g>

  <!-- Dynamic Financial Flow Lines (Subtle background paths) -->
  <g opacity="0.4">
    <path d="M 50 330 Q 300 370 500 290 T 850 250 T 1150 180" fill="none" stroke="url(#chartGrad)" stroke-width="2.5" class="flow-line" />
    <path d="M 80 360 Q 350 260 620 320 T 950 190 T 1160 140" fill="none" stroke="#38BDF8" stroke-width="1.5" class="flow-line-reverse" opacity="0.6" />
    <!-- Relationship Nodes -->
    <circle cx="500" cy="290" r="4" fill="#00f2fe" class="node-1" />
    <circle cx="850" cy="250" r="4" fill="#9d4edd" class="node-2" />
    <circle cx="620" cy="320" r="4" fill="#10b981" class="node-1" />
  </g>

  <!-- Dynamic Floating Decorative Micro-Cards/Pills (Arranged cleanly around borders to keep center clear) -->
  <!-- Top Left Pill -->
  <g class="pill-1" transform="translate(60, 36)">
    <rect width="180" height="34" rx="17" fill="#0E1E38" stroke="#0284C7" stroke-width="1.2" opacity="0.85" filter="url(#shadow)" />
    <circle cx="20" cy="17" r="5" fill="#38BDF8" />
    <text x="34" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#E0F2FE">Wealth Management</text>
  </g>

  <!-- Top Right Pill -->
  <g class="pill-2" transform="translate(940, 36)">
    <rect width="200" height="34" rx="17" fill="#181236" stroke="#9333EA" stroke-width="1.2" opacity="0.85" filter="url(#shadow)" />
    <circle cx="20" cy="17" r="5" fill="#C084FC" />
    <text x="34" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#F3E8FF">Banking Relationships</text>
  </g>

  <!-- Lower Left Pill -->
  <g class="pill-3" transform="translate(70, 345)">
    <rect width="175" height="34" rx="17" fill="#0A221E" stroke="#059669" stroke-width="1.2" opacity="0.85" filter="url(#shadow)" />
    <circle cx="20" cy="17" r="5" fill="#34D399" />
    <text x="34" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#D1FAE5">SEC &amp; FINRA Workflows</text>
  </g>

  <!-- Lower Right Pill -->
  <g class="pill-1" transform="translate(965, 345)">
    <rect width="165" height="34" rx="17" fill="#251605" stroke="#D97706" stroke-width="1.2" opacity="0.85" filter="url(#shadow)" />
    <circle cx="20" cy="17" r="5" fill="#FBBF24" />
    <text x="34" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#FEF3C7">Open-Source &amp; SaaS</text>
  </g>

  <!-- FOREGROUND CONTENT: Title, Subtitle, Badges (Guaranteed on top and unobstructed) -->
  <!-- Center Backdrop Plate for guaranteed legibility -->
  <rect x="180" y="90" width="840" height="230" rx="20" fill="#070c1d" fill-opacity="0.7" stroke="#1e293b" stroke-width="1" filter="url(#shadow)" />

  <!-- Header Category Tag -->
  <g transform="translate(485, 114)">
    <rect width="230" height="28" rx="14" fill="#1E293B" stroke="#38BDF8" stroke-width="1" opacity="0.9" />
    <circle cx="15" cy="14" r="4" fill="#38BDF8" />
    <text x="28" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#38BDF8">FINANCIAL SERVICES ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="188" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-size="40" font-weight="900" letter-spacing="-0.5" fill="url(#titleGrad)" filter="url(#shadow)">
    Awesome Financial Services CRM
  </text>

  <!-- Subtitle -->
  <text x="600" y="228" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94A3B8">
    Curated SaaS Platforms &amp; Open-Source Projects for Wealth Managers, Advisors &amp; Private Banking
  </text>

  <!-- Feature Metric Badges inside Foreground Area -->
  <g transform="translate(240, 260)">
    <!-- Badge 1: SaaS Count -->
    <g transform="translate(0, 0)">
      <rect width="210" height="38" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="105" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#F8FAFC">
        💼 Top 10 Enterprise SaaS
      </text>
    </g>
    <!-- Badge 2: Open Source Count -->
    <g transform="translate(245, 0)">
      <rect width="230" height="38" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="115" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38BDF8">
        🌐 17+ Open-Source Solutions
      </text>
    </g>
    <!-- Badge 3: Pricing & Market Analysis -->
    <g transform="translate(505, 0)">
      <rect width="215" height="38" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="107" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#34D399">
        📊 Real Pricing &amp; Market Data
      </text>
    </g>
  </g>

  <!-- Outer Frame Border -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="#1E293B" stroke-width="1.5" />
</svg>
